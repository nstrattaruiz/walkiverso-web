<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Walkiverso</title>
  <meta name="description" content="">
  <meta name="theme-color" content="#030605">
  <!-- Base de la web: "/" en la plataforma. Al publicar en GitHub Pages se cambia por "/<repo>/" (.github/workflows/pages.yml) -->
  <base href="/">
  <script>window.WK_BASE = new URL(document.baseURI).pathname.replace(/\/$/, '');</script>
  <link rel="icon" type="image/png" href="walkiver/assets/wk-favicon-64.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="modulepreload" href="js/vendor/three.module.min.js">
  <link rel="stylesheet" href="css/ns-firma.css">
  <!-- Piezas mágicas (planeta, cartas, ritual, deseo, sobre, grimorios, entrada) -->
  <link rel="stylesheet" href="css/walkiverso.css">
  <link rel="stylesheet" href="css/secciones.css">
  <link rel="stylesheet" href="css/experiencias.css">
  <link rel="stylesheet" href="css/organico.css">
  <link rel="stylesheet" href="css/rediseno.css">
  <!-- Sistema de diseño (estructura de PULSO con la magia de Walkiverso): manda sobre todo lo anterior -->
  <link rel="stylesheet" href="css/wv.css">
  <link rel="stylesheet" href="css/noche.css">
  <!-- El bosque vivo, tienda clara, cursor y fluidez: manda sobre todo -->
  <link rel="stylesheet" href="css/bosque.css">
  <script>
    (function () {
      var s = location.pathname.slice(window.WK_BASE.length).split('/').filter(Boolean)[0] || '';
      if (s === 'walkurio') document.documentElement.classList.add('arranca-con-mundo');
      // En el inicio, la noche de la entrada se pinta desde el primer instante (sin ver la web antes)
      if ((s === '' || s === 'index.html') && !matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('con-entrada');
    })();
  </script>
</head>
<body>
  <div class="wk-previo" aria-hidden="true"></div>
  <!-- El bosque vivo: fondo de las páginas de noche (js/bosque.js) -->
  <div class="wb-bosque" id="bosque" aria-hidden="true"></div>
  <div class="wv-cursor" id="cursor" aria-hidden="true"><i class="wv-cursor__aro"></i><i class="wv-cursor__punto"></i></div>
  <a class="wv-skip" href="#app">Saltar al contenido</a>
  <!-- Walkiverso · web para la plataforma (Kit NS). Los datos salen de la tienda con el SDK: ver js/app.js. -->

  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-wa" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.2-3.8A8 8 0 1 1 8 19.1z"/><path d="M9.2 8.6c.2-.4.5-.4.8-.4h.4l.9 2-.6.9c.5 1 1.3 1.8 2.3 2.3l.9-.6 2 .9v.4c0 .3 0 .6-.4.8-.9.6-2.3.4-4-.8a9 9 0 0 1-2.8-3.1c-.7-1.4-.1-2.1.5-2.4z"/></g></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6 8.5 7 8.5-7"/></g></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M5 3h3.5l1.7 4.3-2.2 1.4a11 11 0 0 0 7.3 7.3l1.4-2.2L21 15.5V19a2 2 0 0 1-2 2A17 17 0 0 1 3 5a2 2 0 0 1 2-2z"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></g></symbol>
    <symbol id="i-ig" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r=".6" fill="currentColor"/></g></symbol>
    <symbol id="i-fb" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="M14 8.5h2.5V5H14a3.5 3.5 0 0 0-3.5 3.5V11H8v3.5h2.5V21H14v-6.5h2.5L17 11h-3V9a.5.5 0 0 1 .5-.5z"/></symbol>
    <symbol id="i-bag" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 11.1a1 1 0 0 1-1 .9H7.2a1 1 0 0 1-1-.9z"/><path d="M9 10V7a3 3 0 0 1 6 0v3"/></g></symbol>
    <symbol id="i-flecha" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M5 12h14m-5-5 5 5-5 5"/></symbol>
    <symbol id="i-abajo" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="m7 10 5 5 5-5"/></symbol>
    <symbol id="i-buscar" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></g></symbol>
    <symbol id="i-chispa" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2c.5 4.6 2.4 7 7.5 8-5.1 1-7 3.4-7.5 8-.5-4.6-2.4-7-7.5-8 5.1-1 7-3.4 7.5-8z"/></symbol>
    <symbol id="i-estrella" viewBox="0 0 24 24"><path fill="currentColor" d="m12 3 2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/></symbol>
    <symbol id="i-cerrar" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-mas" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-girar" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></g></symbol>
    <symbol id="i-planeta" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="6"/><path d="M3.5 15.5c-1.4 2.2 2.5 3 8 1.4s9.6-4.8 8.9-7.2c-.3-1-1.6-1.4-3.4-1.3"/></g></symbol>
    <symbol id="i-pluma" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4C12 5 7 10 6 18l-2 2"/><path d="M20 4c-1 6-5 10-12 11"/><path d="M12 11l-4 4"/></g></symbol>
    <symbol id="i-criatura" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-1 2-3 2.5-3 5 0 1 .4 1.6 1 2"/><path d="M12 3c1 2 3 2.5 3 5 0 1-.4 1.6-1 2"/><path d="M7 21c0-6 2-9 5-9s5 3 5 9"/><path d="M9 17c-2 0-4-1-5-3M15 17c2 0 4-1 5-3"/><circle cx="10.5" cy="15" r=".6" fill="currentColor"/><circle cx="13.5" cy="15" r=".6" fill="currentColor"/></g></symbol>
    <symbol id="i-bitacora" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h11a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M8 3v18"/><path d="M12 9l1 2 2 .3-1.5 1.4.4 2.1L12 13.8l-1.9 1 .4-2.1L9 11.3l2-.3z"/></g></symbol>
    <symbol id="i-taller" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V10l8-6 8 6v11"/><path d="M9 21v-6h6v6"/><path d="M12 8.5v2"/></g></symbol>
    <symbol id="i-corazon" viewBox="0 0 24 24"><path style="fill: var(--relleno, none)" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z"/></symbol>
    <symbol id="i-usuario" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1.3-3.8 4.2-5.6 7.5-5.6s6.2 1.8 7.5 5.6"/></g></symbol>
    <symbol id="i-caja" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3 20 7.5v9L12 21l-8-4.5v-9z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9"/></g></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-menos" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M5 12h14"/></symbol>
    <symbol id="i-basura" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/></g></symbol>
    <symbol id="i-diagonal" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M7 17 17 7M8 7h9v9"/></symbol>
    <symbol id="i-camion" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></g></symbol>
    <symbol id="i-sello" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="10" r="6"/><path d="m9 15-1.5 6L12 19l4.5 2L15 15"/></g></symbol>
    <symbol id="i-hoja" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19C5 10 10 5 20 4c0 10-5 15-14 15z"/><path d="M5 19 13 11"/></g></symbol>
    <symbol id="i-filtro" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M4 7h16M7 12h10M10 17h4"/></symbol>
  </svg>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="ondas" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="3" result="ruido">
        <animate attributeName="baseFrequency" dur="6s" values="0.012 0.02;0.02 0.012;0.012 0.02" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="14" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <!-- ============ Firma NS: header píldora + ☰ en círculo + menú grande ============ -->
  <header class="ns-header" id="ns-header">
    <button class="ns-menu-btn" type="button" aria-expanded="false" aria-controls="ns-panel" aria-label="Abrir menú">
      <span class="ns-menu-btn__lines" aria-hidden="true"><span></span><span></span></span>
    </button>
    <div class="ns-bar">
      <a class="ns-brand" href="/" data-link aria-label="Walkiverso, ir al inicio"><img class="wk-logo" id="marca" src="img/logo.svg" alt="Walkiverso" width="150" height="40"></a>
      <nav class="ns-nav" aria-label="Principal" id="nav"></nav>
      <div class="wv-actions">
        <button type="button" class="wv-iconbtn" id="abrir-busqueda" aria-label="Buscar en el Walkiverso" title="Buscar ( / )"><svg class="i" aria-hidden="true"><use href="#i-buscar"/></svg></button>
        <a class="wv-iconbtn wv-actions__fav" href="/favoritos" data-link id="abrir-favoritos" aria-label="Mis favoritos"><svg class="i" aria-hidden="true"><use href="#i-corazon"/></svg><b class="wv-count wv-count--dot" id="contador-fav" hidden>0</b></a>
        <a class="wv-login" href="/cuenta" data-link id="abrir-cuenta" aria-label="Ingresar a mi cuenta"><svg class="i" aria-hidden="true"><use href="#i-usuario"/></svg><span>Ingresar</span></a>
        <button type="button" class="wv-cartbtn" id="abrir-carrito" aria-label="Abrir carrito">
          <svg class="i" aria-hidden="true"><use href="#i-bag"/></svg><span class="wv-cartbtn__label">Carrito</span>
          <span class="wv-count" id="contador">0</span>
        </button>
      </div>
    </div>

    <!-- Menú grande: comportamiento de la firma NS, diseño propio (3 columnas, colecciones en tarjetas) -->
    <div class="ns-panel wv-menu" id="ns-panel" aria-hidden="true">
      <nav class="ns-panel__nav" aria-label="Menú" id="panel-nav"></nav>
      <div class="wv-menu__cats">
        <p class="ns-panel__label">Colecciones</p>
        <div class="wv-menu__grid" id="menu-cats"></div>
      </div>
      <div class="ns-panel__info wv-menu__side" id="hablemos">
        <a class="wv-menu__promo" href="/walkurio" data-link>
          <span class="wv-menu__planeta" aria-hidden="true"></span>
          <span class="wv-menu__promo-tag">Cartografía</span>
          <strong>Recorré Walkurio, el planeta de las criaturas</strong>
          <span class="wv-menu__promo-link">Explorar el planeta</span>
        </a>
        <p class="ns-panel__label">Hablemos</p>
      </div>
    </div>
  </header>
  <div class="ns-scrim" aria-hidden="true"></div>

  <!-- ============ Walkurio en 3D (/walkurio). Vive fuera de #app para no recrearse al navegar ============ -->
  <section class="wk-mundo" id="mundo" aria-label="Walkurio, el planeta del Walkiverso">
    <canvas class="wk-mundo__lienzo" id="lienzo" aria-hidden="true"></canvas>
    <div class="wk-mundo__pines" id="pines"></div>
    <div class="wk-mundo__texto wk-mundo__texto--walkurio">
      <p class="wk-antetitulo" id="wkr-ante"></p>
      <h1 class="wk-hero__titulo wk-hero__titulo--walkurio" id="wkr-titulo"></h1>
      <p class="wk-hero__bajada" id="wkr-bajada"></p>
      <div class="wk-hero__botones">
        <button type="button" class="wv-btn wv-btn--luz wv-btn--lg" id="wkr-boton"></button>
        <a class="wv-btn wv-btn--outline-light wv-btn--lg" href="#guia">Guía de regiones</a>
      </div>
    </div>
    <p class="wk-mundo__pista wk-mundo__pista--walkurio" id="wkr-pista"><svg aria-hidden="true"><use href="#i-chispa"/></svg><span></span></p>
    <aside class="wk-region" id="region" aria-live="polite" hidden></aside>
    <a class="wk-mundo__bajar" href="#guia" aria-label="Bajar a la guía de regiones"><span></span></a>
  </section>

  <main id="app" tabindex="-1"></main>

  <footer class="wv-footer" id="pie"></footer>

  <!-- Buscador -->
  <div class="wv-modal wv-modal--search" id="busqueda" role="dialog" aria-modal="true" aria-label="Buscar en el Walkiverso" hidden>
    <div class="wv-scrim" data-cerrar-busqueda></div>
    <div class="wv-modal__card">
      <form class="wv-search__form" id="busqueda-form" role="search">
        <svg class="i" aria-hidden="true"><use href="#i-buscar"/></svg>
        <input type="search" id="q" autocomplete="off" aria-label="Buscar" placeholder="Una criatura, un objeto, una región…">
        <kbd aria-hidden="true">Esc</kbd>
      </form>
      <div class="wv-search__results" id="busqueda-res" aria-live="polite"></div>
    </div>
  </div>

  <!-- ============ Firma NS: carrito deslizable con fondo desenfocado ============ -->
  <div class="wv-scrim wv-scrim--cart" id="carrito-velo" hidden></div>
  <aside class="wv-drawer" id="carrito" aria-label="Carrito" aria-hidden="true" inert>
    <div class="wv-drawer__head">
      <div><h2>Tu carrito</h2><p class="wv-drawer__count" id="carrito-cuenta"></p></div>
      <button type="button" class="wv-iconbtn wv-iconbtn--light" id="cerrar-carrito" aria-label="Cerrar carrito"><svg class="i" aria-hidden="true"><use href="#i-cerrar"/></svg></button>
    </div>
    <div class="wv-drawer__body" id="carrito-lineas"></div>
    <div class="wv-drawer__foot" id="carrito-pie"></div>
  </aside>

  <div class="wv-toasts" id="avisos" aria-live="polite"></div>
  <div class="cookies wv-cookies" id="cookies" hidden></div>
  <p class="wk-demo" id="demo" hidden>Modo demo · datos de ejemplo</p>

  <!-- ============ Firma NS: volver arriba con anillo de progreso ============ -->
  <div class="ns-top" id="ns-top">
    <button type="button" class="ns-top__button" aria-label="Volver arriba">
      <svg class="ns-top__ring" viewBox="0 0 56 56" aria-hidden="true" focusable="false">
        <circle class="ns-top__track" cx="28" cy="28" r="25"/>
        <circle class="ns-top__progress" cx="28" cy="28" r="25" pathLength="1"/>
      </svg>
      <svg class="ns-top__arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <script src="js/ns-firma.js" defer></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
