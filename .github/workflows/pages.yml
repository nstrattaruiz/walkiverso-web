# Publica la web en GitHub Pages en cada cambio a main (vista previa para ver desde cualquier lugar).
# En Pages la web vive en una subcarpeta (/<repo>/): se ajusta el <base> y se crea 404.html para las rutas internas.
# En la plataforma no se usa: allá se sube la carpeta tal cual (.zip).
name: Publicar en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Armar el sitio
        run: |
          mkdir ../sitio
          rsync -a --exclude '.git' --exclude '.github' --exclude '.dev' ./ ../sitio/
          REPO="${GITHUB_REPOSITORY#*/}"
          sed -i "s#<base href=\"/\">#<base href=\"/$REPO/\">#" ../sitio/index.html
          cp ../sitio/index.html ../sitio/404.html
          touch ../sitio/.nojekyll
          mv ../sitio ./_sitio
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio
      - id: deploy
        uses: actions/deploy-pages@v4
